<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second Serving</title>
    <!--Stylesheet link-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!--font loading - work sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="toast" id ="flashToast">{{ messages[0] }}</div>
            <script>
                setTimeout(function() {
                    document.getelementById("flashToast").style.display = "none";
                }, 3000);
            </script>
        {% endif %}
        {% endwith %}

    <!--nav bar-->
    <nav class="navBar">
        <span class="navBrand">Second Serving</span>
        <div class="navLinks">
            <a href="{{ url_for('home') }}" class="{{ 'active' if activePage == 'home' }}">Home</a>
            <a href="{{ url_for('post') }}" class="{{ 'active' if activePage == 'post' }}">Post</a>
            <a href="{{ url_for('charities') }}" class="{{ 'active' if activePage == 'charities' }}">Charities</a>
            <a href="{{ url_for('gardens') }}" class="{{ 'active' if activePage == 'gardens' }}">Gardens</a>
        </div>
    </nav>

    <div class="pageContent">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
